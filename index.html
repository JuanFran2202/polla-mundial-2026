<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#C8102E"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Polla 2026"/>
<title>Polla Mundialista 2026 ⚽</title>

<style>
:root{
  --red:#C8102E;
  --blue:#003DA5;
  --green:#007A33;
  --gold:#c9a84c;
  --white:#ffffff;
  --offwhite:#f5f7fa;
  --light:#eef1f6;
  --border:#dde2ea;
  --text:#1a1a2e;
  --muted:#6b7280;
  --dark:#111827;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--offwhite);font-family:'Barlow',sans-serif;color:var(--text);min-height:100vh;overflow-x:hidden;}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
.screen{max-width:700px;margin:0 auto;padding:20px 16px 100px;animation:fadeUp .3s ease;}
/* CARDS */
.card{background:var(--white);border:1px solid var(--border);border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.card-red{background:linear-gradient(135deg,rgba(200,16,46,.07),rgba(200,16,46,.02));border:1px solid rgba(200,16,46,.2);border-radius:14px;}
.card-blue{background:linear-gradient(135deg,rgba(0,61,165,.07),rgba(0,61,165,.02));border:1px solid rgba(0,61,165,.2);border-radius:14px;}
.card-green{background:linear-gradient(135deg,rgba(0,122,51,.07),rgba(0,122,51,.02));border:1px solid rgba(0,122,51,.2);border-radius:14px;}
/* INPUTS */
.inp{width:100%;background:var(--offwhite);border:1.5px solid var(--border);border-radius:10px;color:var(--text);padding:12px 14px;font-size:16px;font-family:'Barlow',sans-serif;outline:none;transition:border .2s;}
.inp:focus{border-color:var(--blue);background:var(--white);}
.lbl{display:block;font-size:10px;letter-spacing:2px;color:var(--muted);margin-bottom:5px;font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;}
/* BUTTONS */
.btn{cursor:pointer;border:none;border-radius:10px;font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;transition:all .18s;}
.btn:hover{transform:translateY(-2px);filter:brightness(1.05);}
.btn-red{background:var(--red);color:#fff;padding:14px 28px;font-size:18px;width:100%;box-shadow:0 4px 14px rgba(200,16,46,.3);}
.btn-blue{background:var(--blue);color:#fff;padding:12px 20px;font-size:15px;width:100%;box-shadow:0 4px 14px rgba(0,61,165,.2);}
.btn-green{background:var(--green);color:#fff;padding:12px 20px;font-size:15px;width:100%;box-shadow:0 4px 14px rgba(0,122,51,.2);}
.btn-ghost{background:var(--light);border:1.5px solid var(--border);color:var(--muted);padding:9px 18px;font-size:13px;}
.btn-outline-red{background:transparent;border:1.5px solid var(--red);color:var(--red);padding:12px 20px;font-size:15px;width:100%;}
/* SCORE */
.score-inp{width:44px;text-align:center;background:var(--light);border:1.5px solid var(--border);border-radius:7px;color:var(--blue);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:21px;padding:5px 2px;outline:none;transition:border .2s;}
.score-inp:focus{border-color:var(--blue);}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;}
/* MATCH ROW */
.match-row{display:flex;align-items:center;gap:6px;padding:9px 11px;border-radius:10px;margin-bottom:5px;background:var(--offwhite);border:1px solid var(--border);}
.match-row.win{background:rgba(0,122,51,.07);border-color:rgba(0,122,51,.25);}
.match-row.lose{background:rgba(200,16,46,.04);border-color:rgba(200,16,46,.12);}
/* TABS */
.phase-tabs{display:flex;gap:5px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:none;}
.tab{cursor:pointer;border:none;border-radius:8px;white-space:nowrap;padding:7px 12px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;letter-spacing:1px;text-transform:uppercase;transition:all .18s;flex-shrink:0;}
.tab.active{background:var(--blue);color:#fff;box-shadow:0 2px 8px rgba(0,61,165,.25);}
.tab.inactive{background:var(--light);color:var(--muted);border:1px solid var(--border);}
/* LEAGUE CARD */
.league-card{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:10px;cursor:pointer;transition:all .2s;box-shadow:0 1px 4px rgba(0,0,0,.05);}
.league-card:hover{box-shadow:0 4px 16px rgba(0,61,165,.12);border-color:rgba(0,61,165,.3);transform:translateY(-1px);}
/* RANK ROW */
.rank-row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:13px;margin-bottom:7px;}
/* MISC */
.hidden{display:none!important;}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:9999;color:#fff;padding:11px 26px;border-radius:40px;font-family:'Barlow',sans-serif;font-size:15px;font-weight:500;box-shadow:0 6px 28px rgba(0,0,0,.2);animation:fadeUp .25s ease;white-space:nowrap;}
.header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:11px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;box-shadow:0 1px 6px rgba(0,0,0,.06);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.stat-box{padding:14px 10px;text-align:center;}
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent);margin:16px 0;}
/* TRICOLOR BAR */
.tribar{height:4px;background:linear-gradient(90deg,var(--red) 33.3%,var(--blue) 33.3% 66.6%,var(--green) 66.6%);border-radius:2px;}
/* SECTION TITLE */
.sec-title{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;}
select option{background:var(--white);}
::-webkit-scrollbar{width:3px;height:3px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
/* MATCH DATE BADGE */
.date-badge{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:10px;letter-spacing:1px;background:var(--light);border:1px solid var(--border);border-radius:6px;padding:2px 6px;color:var(--muted);white-space:nowrap;flex-shrink:0;}
.ecu-badge{background:rgba(200,16,46,.1);border-color:rgba(200,16,46,.2);color:var(--red);}
</style>
</head>

const KEY="polla_2026_v7";
const loadDb=()=>{try{const d=localStorage.getItem(KEY);return d?JSON.parse(d):{users:{},leagues:{},preds:{}};}catch{return{users:{},leagues:{},preds:{}};}};
const saveDb=d=>{try{localStorage.setItem(KEY,JSON.stringify(d));}catch{}};

const genCode=n=>n.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6)+Math.floor(100+Math.random()*900);

function calcPoints(pred,results){
  if(!pred||!results)return 0;
  let pts=0;
  if(pred.champion&&pred.champion===results.champion)pts+=15;
  if(pred.runner&&pred.runner===results.runner)pts+=8;
  if(pred.third&&pred.third===results.third)pts+=5;
  FIXTURE.forEach(m=>{
    const p=(pred.matches||{})[m.id],r=(results.matches||{})[m.id];
    if(!p||!r||r.home===""||r.away==="")return;
    const ph=+p.home,pa=+p.away,rh=+r.home,ra=+r.away;
    if([ph,pa,rh,ra].some(isNaN))return;
    const b=BONUS[m.phase]||1;
    const pR=ph>pa?"H":ph<pa?"A":"D",rR=rh>ra?"H":rh<ra?"A":"D";
    if(pR===rR)pts+=Math.round(2*b);
    if(ph===rh&&pa===ra)pts+=Math.round(3*b);
  });
  return pts;
}

  function showLeaderboard(){
    const lp=db.preds[currentLeague.id]||{},results=currentLeague.results||{};
    const lb=currentLeague.members.map(uid=>({...db.users[uid],pts:calcPoints(lp[uid],results)})).filter(Boolean).sort((a,b)=>b.pts-a.pts);
    const res=Object.values(results.matches||{}).filter(r=>r&&r.home!=="").length;
    const myPts=calcPoints(lp[currentUser.id],results);
    const rows=lb.map((u,i)=>{
      const isMe=u.id===currentUser.id;
      const p=lp[u.id];
      const medal=["🥇","🥈","🥉"][i]||(i+1);
      const bg=isMe?"rgba(200,16,46,.06)":i===0?"rgba(0,61,165,.04)":"rgba(0,0,0,.02)";
      const bdr=isMe?"2px solid rgba(200,16,46,.3)":i===0?"1px solid rgba(0,61,165,.2)":"1px solid var(--border)";
      const bl=isMe?"4px solid var(--red)":i===0?"4px solid var(--blue)":"4px solid transparent";
      return `<div class="rank-row" style="background:${bg};border:${bdr};border-left:${bl};box-shadow:0 1px 4px rgba(0,0,0,.05)">
        <span style="font-size:${i<3?26:17}px;min-width:28px;text-align:center">${medal}</span>
        <div style="flex:1">
          <div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:18px;letter-spacing:1px;color:${isMe?"var(--red)":i===0?"var(--blue)":"var(--text)"}">${currentLeague.adminId===u.id?"👑 ":""}${u.name}${isMe?" <span style='font-size:13px;color:var(--muted)'>(tú)</span>":""}</div>
          ${p?.champion?`<div style="font-size:12px;color:var(--muted);margin-top:2px">🏆 ${fl(p.champion)} ${p.champion}${p.champion===results.champion?' <span style="color:var(--green);font-weight:700">✅</span>':''}</div>`:""}
        </div>
        <div style="text-align:right">
          <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:30px;color:${isMe?"var(--red)":i===0?"var(--blue)":"var(--muted)"};line-height:1">${u.pts}</div>
          <div style="font-size:8px;color:var(--muted);letter-spacing:1.5px;margin-top:2px">PUNTOS</div>
        </div>
      </div>`;
    }).join("");
    const myPred=lp[currentUser.id];
    let desglose="";
    if(myPred){
      let lines="";
      PHASES.forEach(ph=>{
        let pp=0;
        FIXTURE.filter(m=>m.phase===ph).forEach(m=>{
          const p=(myPred.matches||{})[m.id],r=(results.matches||{})[m.id];
          if(!p||!r||r.home===""||r.away==="")return;
          const ph2=+p.home,pa=+p.away,rh=+r.home,ra=+r.away;
          if([ph2,pa,rh,ra].some(isNaN))return;
          const b=BONUS[ph]||1;
          const pR=ph2>pa?"H":ph2<pa?"A":"D",rR=rh>ra?"H":rh<ra?"A":"D";
          if(pR===rR)pp+=Math.round(2*b);
          if(ph2===rh&&pa===ra)pp+=Math.round(3*b);
        });
        if(pp>0)lines+=`<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:4px 0;border-bottom:1px solid var(--border)"><span>${ph}</span><span style="color:var(--blue);font-weight:600">${pp} pts</span></div>`;
      });
      const pod=(myPred.champion===results.champion?15:0)+(myPred.runner===results.runner?8:0)+(myPred.third===results.third?5:0);
      if(pod>0)lines+=`<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:4px 0;border-bottom:1px solid var(--border)"><span>Podio</span><span style="color:var(--green);font-weight:600">${pod} pts</span></div>`;
      if(lines)desglose=`<div class="card" style="padding:16px;margin-top:14px"><div style="font-size:10px;letter-spacing:2px;color:var(--muted);margin-bottom:10px;font-family:'Barlow Condensed',sans-serif;font-weight:700">MI DESGLOSE EN ESTA LIGA</div>${lines}<div style="display:flex;justify-content:space-between;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:22px;color:var(--red);padding-top:8px;letter-spacing:1px"><span>TOTAL</span><span>${myPts} pts</span></div></div>`;
    }
    render(`
      <h2 style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:32px;color:var(--blue);letter-spacing:2px;margin-bottom:2px">🏅 CLASIFICACIÓN</h2>
      <p style="color:var(--muted);font-size:13px;margin-bottom:18px">${currentLeague.name} · ${res} resultados · puntos en tiempo real</p>
      ${rows}
      ${desglose}
    `);
  }

  function login(){

    currentUser=u;
    const code=location.hash.replace("#","").trim();
    if(code){const l=Object.values(db.leagues).find(l=>l.code===code);if(l){joinLeagueAction(l);return;}}
    showLeagues(); toast(`¡Bienvenido, ${u.name}! ⚽`);
  }
  function register(){
    const name=document.getElementById("r-name")?.value.trim(),pass=document.getElementById("r-pass")?.value,pass2=document.getElementById("r-pass2")?.value;
    if(!name)return toast("Ingresa tu nombre",true);
    if(pass.length<4)return toast("Contraseña mínimo 4 caracteres",true);
    if(pass!==pass2)return toast("Las contraseñas no coinciden",true);
    if(Object.values(db.users).find(u=>u.name.toLowerCase()===name.toLowerCase()))return toast("Ese nombre ya existe",true);
    const nu={id:genId(),name,pass};
    persist({...db,users:{...db.users,[nu.id]:nu}});
    currentUser=nu;
    const code=location.hash.replace("#","").trim();
    if(code){const l=Object.values(db.leagues).find(l=>l.code===code);if(l){joinLeagueAction(l);return;}}
    showLeagues(); toast(`¡Registrado! Bienvenido ${nu.name} ⚽`);
  }
  function createLeague(){
    const name=document.getElementById("new-name")?.value.trim();
    if(!name)return toast("Ponle nombre a la liga",true);
    const id=genId(),code=genCode(name);
    const l={id,name,code,adminId:currentUser.id,members:[currentUser.id],results:{champion:"",runner:"",third:"",matches:{}}};
    persist({...db,leagues:{...db.leagues,[id]:l}});
    currentLeague=l; showLeagueHome(); toast(`Liga "${name}" creada! 🎉`);
  }
  function joinByCode(){
    const code=document.getElementById("join-code")?.value.trim().toUpperCase();
    const l=Object.values(db.leagues).find(l=>l.code===code);
    if(!l)return toast("Código incorrecto",true);
    joinLeagueAction(l);
  }
  function joinLeagueAction(l){
    if(l.members.includes(currentUser.id)){currentLeague=l;location.hash="";showLeagueHome();toast(`Entrando a "${l.name}"...`);return;}
    const upd={...l,members:[...l.members,currentUser.id]};
    persist({...db,leagues:{...db.leagues,[l.id]:upd}});
    currentLeague=upd; location.hash=""; showLeagueHome(); toast(`¡Te uniste a "${l.name}"! ⚽`);
  }
  function setPodio(k,v){if(editPred)editPred[k]=v;}
  function setResPodio(k,v){if(editRes)editRes[k]=v;}
  function updateScore(id,side,val){
    const t=editPred!==null?editPred:editRes; if(!t)return;
    if(!t.matches)t.matches={};
    if(!t.matches[id])t.matches[id]={home:"",away:""};
    t.matches[id][side]=val;
  }
  function savePred(){
    if(!editPred.champion)return toast("Elige tu campeón 🏆",true);
    const lp=db.preds[currentLeague.id]||{};
    persist({...db,preds:{...db.preds,[currentLeague.id]:{...lp,[currentUser.id]:editPred}}});
    editPred=null; toast("¡Predicciones guardadas! 🎯"); showLeagueHome();
  }
  function saveRes(){
    const upd={...currentLeague,results:editRes};
    persist({...db,leagues:{...db.leagues,[currentLeague.id]:upd}});
    currentLeague=upd; editRes=null; toast("Resultados actualizados ✅"); showLeagueHome();
  }
  function setPhase(p){activePhase=p;if(editPred!==null)renderPredict();else if(editRes!==null)renderResults();else showMatchView();}
  function openLeague(id){currentLeague=db.leagues[id];showLeagueHome();}
  function goLeagues(){currentLeague=null;showLeagues();}
  function logout(){currentUser=null;currentLeague=null;editPred=null;editRes=null;showLogin();}

  function init(){
    const code=location.hash.replace("#","").trim();
    showLogin(code&&Object.values(db.leagues).find(l=>l.code===code)?code:"");
  }

  return{init,login,register,logout,showLogin,showRegister,showLeagues,showCreateLeague,showJoinLeague,openLeague,goLeagues,showPredict,showResults,showMatchView,showLeaderboard,createLeague,joinByCode,setPodio,setResPodio,updateScore,savePred,saveRes,setPhase,toast};
})();

App.init();
</script>
</body>
</html>
